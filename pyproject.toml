[tool.poetry]
name = "learn-from"
version = "0.1.0"
description = "access youtube video apis for the purpose of capturing transcripts for ai workflows"
authors = ["Dan V"]
license = "MIT"
readme = "README.md"
include = ["src/learn_from/explorer_static/**/*", "src/learn_from/prompts.json"]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
sqlalchemy = "^2.0.44"
psycopg = { version = "^3.2.11", extras = ["binary"] }
pydantic = "^2.12.0"
pydantic-settings = "^2.11.0"
alembic = "^1.17.0"
youtube-transcript-api = "^1.2.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"

[tool.poetry.scripts]
learn-from = "learn_from.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
